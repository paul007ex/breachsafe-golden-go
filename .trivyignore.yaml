#
# Trivy suppressions for this image, scoped to the five upstream Go security tools it bundles:
# govulncheck, staticcheck, gosec, osv-scanner, golangci-lint.
#
# WHY THESE ARE SUPPRESSED
#
# Trivy's `gobinary` scanner reads the module graph compiled into each binary and reports every
# transitive dependency carrying an advisory. These are third-party release binaries pinned by
# version (see the ARG block in the Dockerfile). We do not vendor, patch, or rebuild them, so
# there is no fix we can apply short of waiting for the upstream tool to bump its own deps.
#
# They are also not a runtime attack surface in the way an application dependency is. These tools
# run inside CI against the caller's own source tree; they do not serve traffic, accept untrusted
# network input, or run with credentials beyond the job token.
#
# WHAT IS DELIBERATELY NOT SUPPRESSED
#
#   * The Alpine base layer. It reported 0 findings and must stay at 0. A base-image CVE is a
#     real finding and this file must never hide one.
#   * Anything under /go/pkg/mod. 45 of the original 51 findings came from the Go module cache
#     shipping inside the image, including dependency TEST FIXTURES (guava-31.1-jre.jar,
#     javareach-test.jar, docker/distribution integration data). That was a build defect: the
#     cache mount targeted /root/go/pkg/mod while the golang base image sets GOPATH=/go, so
#     GOMODCACHE is /go/pkg/mod and nothing was excluded. Fixed by correcting the mount path.
#     Deleting the artifact beats suppressing findings about it, so no entry here covers it.
#
# EXPIRY
#
# Every entry carries expired_at. When it lapses the finding returns and someone re-checks
# whether the upstream tool has released a build with the dependency bumped. This file is a
# dated decision, not a permanent exemption.

vulnerabilities:
  # Generated from an actual scan of the built image, after the module-cache fix, on 2026-08-24.
  # 34 findings across 22 distinct advisories, all inside the five upstream Go tool binaries.
  # go/pkg/mod: 0. Alpine base: 0. Both must stay at 0; nothing here covers them.

  - id: CVE-2026-25681
    paths: ["usr/local/bin/*"]
    statement: >-
      Transitive dependency compiled into upstream Go tool release binaries (gosec).
      Pinned third-party artifacts fixed only when the tool rebuilds against a newer dep;
      not rebuildable here. These tools run inside CI against the caller's own source tree,
      serve no traffic, accept no untrusted network input, and hold no credentials beyond
      the job token.
    expired_at: 2026-11-24

