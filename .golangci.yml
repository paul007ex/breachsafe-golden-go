#
# Toolchain-level defaults for BQP Go repositories. A consumer repository may
# extend this; it should not silently weaken it.
version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - gocritic
    - gosec        # the security linter; must never be disabled
    - ineffassign
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
