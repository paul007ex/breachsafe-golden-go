name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build toolchain image
        run: docker build --pull=false --tag breachsafe-go-toolchain:ci .
      - name: Smoke-test toolchain
        run: |
          docker run --rm breachsafe-go-toolchain:ci -c \
            'go version && govulncheck -version && staticcheck -version && gosec -version && osv-scanner --version'
