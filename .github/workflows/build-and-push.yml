# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: Build and push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - doctor.sh
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false   # never cancel a publish mid-push

env:
  IMAGE: ghcr.io/paul007ex/breachsafe-golden-go

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The tag is derived from the image, so it can never drift from what the
      # image contains. Fixes the case where the workflow published v0.1.0 while
      # the registry served 1.26.6.
      # Composite scheme: <go-version>-r<recipe-revision>.
      # The Go version says what is inside. The revision says the recipe changed,
      # so bumping a linter pin gets a new immutable tag without pretending Go moved.
      - name: Derive tags from the Dockerfile
        id: meta
        run: |
          set -euo pipefail
          go_version="$(grep -oE '^FROM golang:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)"
          [ -n "$go_version" ] || { echo "::error::could not derive Go version from Dockerfile"; exit 1; }
          revision="$(grep -oE '^# recipe-revision: r[0-9]+' Dockerfile | head -1 | grep -oE 'r[0-9]+')"
          [ -n "$revision" ] || { echo "::error::Dockerfile is missing '# recipe-revision: rN'"; exit 1; }
          echo "immutable=${go_version}-${revision}" >> "$GITHUB_OUTPUT"
          echo "patch=${go_version}"                 >> "$GITHUB_OUTPUT"
          echo "series=${go_version%.*}"             >> "$GITHUB_OUTPUT"

      # The patch tag is immutable. Publishing over one is a mistake, not a refresh.
      - name: Refuse to overwrite an existing immutable tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.immutable }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ steps.meta.outputs.immutable }} already exists. Bump the Go version, or delete the tag deliberately."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two targets, two tag sets. Without an explicit `target:` Docker builds the
      # LAST stage in the Dockerfile, which silently published cgo as the default.
      - name: Build and push (lean, default)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: lean
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.immutable }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.patch }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.series }}
            ${{ env.IMAGE }}:latest
          provenance: true
          sbom: true

      - name: Build and push (cgo)
        id: build_cgo
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: cgo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.immutable }}-cgo
            ${{ env.IMAGE }}:${{ steps.meta.outputs.patch }}-cgo
            ${{ env.IMAGE }}:${{ steps.meta.outputs.series }}-cgo
          provenance: true
          sbom: true

      - name: Verify provenance attestation
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${{ steps.build.outputs.digest }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the digest so consumers can pin immutably
        run: |
          {
            echo "### Published"
            echo
            echo '| tag | mutability |'
            echo '|---|---|'
            echo '| `${{ steps.meta.outputs.immutable }}` | immutable | lean |'
            echo '| `${{ steps.meta.outputs.patch }}` | moves per recipe revision | lean |'
            echo '| `${{ steps.meta.outputs.series }}` | moves per Go patch | lean |'
            echo '| `${{ steps.meta.outputs.immutable }}-cgo` | immutable | cgo |'
            echo '| `${{ steps.meta.outputs.series }}-cgo` | moves per Go patch | cgo |'
            echo '| `latest` | moves |'
            echo
            echo 'lean digest: `${{ steps.build.outputs.digest }}`'
            echo 'cgo digest:  `${{ steps.build_cgo.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" > image-digest.txt

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest
          path: image-digest.txt
