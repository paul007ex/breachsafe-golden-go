# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# Build and publish the pinned Go toolchain image, multi-arch, on NATIVE runners.
#
# Previous shape: one ubuntu-latest job with platforms: linux/amd64,linux/arm64, which
# emulates every arm64 instruction through QEMU. Measured on run 32653836373: the amd64
# layer peaked at 207s and the emulated arm64 layer at 1553s, 7.5x, for a 36-minute run
# that then failed at the push. Compiling five Go tools under emulation is close to the
# worst case. breachsafe-container ports the same matrix and finishes in about 3 minutes.
# ubuntu-24.04-arm is free for public repos.
#
# Tags are DERIVED from the Dockerfile's FROM pin, so a tag can never claim a Go version
# the image does not contain. See issue #8: the workflow used to publish v0.1.0/v0.1/latest
# while the only tag that existed was 1.26.6, pushed by hand.
name: Build and push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - doctor.sh
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/paul007ex/breachsafe-golden-go

permissions:
  contents: read

jobs:
  # Read the Go version out of the Dockerfile so tags cannot drift from contents.
  version:
    name: Derive tags from the Dockerfile pin
    runs-on: ubuntu-latest
    outputs:
      patch: ${{ steps.v.outputs.patch }}
      series: ${{ steps.v.outputs.series }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          patch="$(grep -oE '^FROM golang:[0-9]+\.[0-9]+\.[0-9]+-alpine' Dockerfile \
                   | head -1 | sed 's/^FROM golang://; s/-alpine$//')"
          [ -n "$patch" ] || { echo "::error::cannot parse the Go version from Dockerfile FROM"; exit 1; }
          series="${patch%.*}"
          # GOTOOLCHAIN must agree with the base image, or the image runs a different Go
          # than its own tag advertises.
          grep -q "GOTOOLCHAIN=go${patch}" Dockerfile || {
            echo "::error::GOTOOLCHAIN does not match the FROM pin (${patch})"; exit 1; }
          echo "patch=$patch"   >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "tags: $series, $patch, latest"

  build:
    name: Build ${{ matrix.arch }} (native)
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The step that used to be called "Build, scan, and push" ran no scanner at all
      # (issue #7). This one does. Scanned once on amd64: findings are in the Go tool
      # binaries and the Alpine base, both arch-independent for this purpose.
      - name: Build (load) for scanning
        if: matrix.arch == 'amd64'
        run: docker buildx build --platform linux/amd64 --load -t gg:scan --file ./Dockerfile .

      - name: Trivy scan — fail on HIGH/CRITICAL
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gg:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      # Smoke-test the real artefact on its own architecture before it is published.
      - name: Doctor on the built image
        if: matrix.arch == 'amd64'
        run: docker run --rm gg:scan golden-go-doctor

      # The amd64 image is smoke-tested above; the arm64 image was published
      # UNTESTED (issue #17: it shipped amd64 binaries under an arm64 label and
      # nothing caught it). Build+load the current arch and RUN it on this native
      # runner. A label is not evidence the binary executes.
      - name: Doctor the arm64 image on its native runner
        if: matrix.arch != 'amd64'
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" --load \
            -t "gg:smoke-${{ matrix.arch }}" --file ./Dockerfile .
          docker run --rm "gg:smoke-${{ matrix.arch }}" golden-go-doctor

      - name: Build + push ${{ matrix.arch }} by digest (native, no emulation)
        run: |
          set -euo pipefail
          # --provenance=false: a per-arch push WITH provenance is an index, and
          # imagetools create from two indexes crossed platform<->content (#17). Push
          # plain single-arch images; provenance/SBOM are attached once at the merge.
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=false --sbom=false \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --file ./Dockerfile \
            .
          digest="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/meta.json'))['containerimage.digest'])")"
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$digest" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}

  manifest:
    name: Merge multi-arch manifest
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push multi-arch tags
        env:
          SERIES: ${{ needs.version.outputs.series }}
          PATCH: ${{ needs.version.outputs.patch }}
        run: |
          set -euo pipefail
          refs=""
          for f in digests/*; do refs="$refs ${IMAGE}@$(cat "$f")"; done
          # SERIES is what consumers pin: a Go patch bump then needs no edit downstream.
          for tag in "$SERIES" "$PATCH" latest; do
            # shellcheck disable=SC2086  # $refs is an intentional space-separated list of image refs
            docker buildx imagetools create --tag "${IMAGE}:${tag}" $refs
          done
          docker buildx imagetools inspect "${IMAGE}:${SERIES}"

      # A single-arch publish is the exact fault this repo shipped (issue #5): the only
      # tag was arm64-only, so no amd64 CI runner could pull it. Assert both are present
      # rather than trusting that the matrix ran.
      - name: Assert the manifest carries amd64 AND arm64
        env:
          SERIES: ${{ needs.version.outputs.series }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${SERIES}" --raw > /tmp/idx.json
          python3 - <<'EOF'
          import json, sys
          idx = json.load(open("/tmp/idx.json"))
          arches = {
              m.get("platform", {}).get("architecture")
              for m in idx.get("manifests", [])
              if m.get("platform", {}).get("os") == "linux"
          }
          need = {"amd64", "arm64"}
          if not need <= arches:
              print(f"::error::manifest is missing {sorted(need - arches)}; found {sorted(arches)}")
              sys.exit(1)
          print(f"manifest platforms OK: {sorted(arches)}")
          EOF


      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published digest (keyless)
        id: sign
        env:
          SERIES: ${{ needs.version.outputs.series }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:${SERIES}" --format '{{json .Manifest}}' \
                    | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          cosign sign --yes "${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "signed ${IMAGE}@${digest}"

      # Provenance is attached ONCE, on the final multi-arch list — the clean spot,
      # and it lands in the GitHub attestation store so `gh attestation verify` works.
      - name: Attest build provenance for the published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.sign.outputs.digest }}
          push-to-registry: true

  # Post-publish executable smoke on NATIVE runners (no QEMU — emulating a full Go
  # toolchain is far too slow). Docker selects the matching arch from the multi-arch
  # tag automatically, so each runner exercises the real published image for its own
  # architecture. This is the gate #17 lacked: run the image, do not trust the label.
  smoke:
    name: Smoke ${{ matrix.arch }} (native, published tag)
    needs: [version, manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the published image on native ${{ matrix.arch }}
        env:
          SERIES: ${{ needs.version.outputs.series }}
        run: |
          set -euo pipefail
          got="$(docker run --rm "${IMAGE}:${SERIES}" -c 'uname -m')"
          echo "published ${IMAGE}:${SERIES} ran on native ${{ matrix.arch }} as: ${got}"
          docker run --rm "${IMAGE}:${SERIES}" golden-go-doctor
